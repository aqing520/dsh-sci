<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-sci</title>
  <style>
    :root { font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; color: #18212b; background: #f7f8fa; }
    * { box-sizing: border-box; } body { margin: 0; height: 100vh; overflow: hidden; }
    button, input, select, textarea { font: inherit; } button { cursor: pointer; }
    .app { height: 100vh; display: flex; background: #f8fafc; }
    .sidebar { width: 268px; flex: 0 0 268px; padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; background: rgba(255,255,255,.88); border-right: 1px solid #e9edf2; }
    .brand { display:flex; align-items:center; gap: 10px; padding: 2px 8px; font-weight: 750; font-size: 17px; }
    .brand-mark { width: 28px; height: 28px; display:grid; place-items:center; border-radius: 9px; color: white; background: linear-gradient(145deg,#4b86f7,#7c5cff); box-shadow: 0 5px 14px #7d8cff44; }
    .new-chat { border: 1px solid #e1e7ef; background: #fff; border-radius: 11px; padding: 11px 13px; text-align: left; color: #283342; box-shadow: 0 2px 8px #3341550b; }
    .new-chat:hover { border-color:#b9c9ef; background:#f8faff; } .plus { color:#476de8; font-size: 18px; margin-right: 6px; }
    .section-title { padding: 0 10px; color: #9aa5b1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .workspace { border: 1px solid #e8edf3; border-radius: 12px; padding: 11px; background: #fbfcfe; }
    .workspace-head { display:flex; align-items:center; gap:8px; font-size: 13px; font-weight: 650; } .folder { color:#4b78e8; }
    .workspace-path { margin-top: 7px; color:#98a3af; font-size: 11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history { display:flex; flex-direction:column; gap:3px; overflow:auto; } .history-item { padding: 10px 11px; border-radius: 9px; font-size: 13px; color:#596575; }
    .history-item.active { background:#eef3ff; color:#3159c9; font-weight:600; }
    .sidebar-bottom { margin-top:auto; display:flex; flex-direction:column; gap:8px; } .plain { background: transparent; border:0; text-align:left; color:#778391; padding:9px 10px; border-radius:8px; } .plain:hover { background:#f1f4f8; color:#334155; }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    .topbar { height: 60px; display:flex; align-items:center; justify-content:space-between; padding: 0 28px; border-bottom:1px solid #edf0f4; background:#fff; }
    .title { font-size: 14px; color:#5c6876; } .status { display:flex; gap:7px; align-items:center; font-size:12px; color:#85919d; } .dot { width:7px; height:7px; border-radius:50%; background:#42bd82; }
    .conversation { width:min(900px, calc(100% - 64px)); margin:0 auto; flex:1; display:flex; flex-direction:column; }
    .welcome { margin:auto; text-align:center; transform: translateY(-18px); } .welcome-icon { margin:0 auto 16px; width:54px; height:54px; display:grid; place-items:center; border-radius:17px; color:white; font-size:23px; background:linear-gradient(145deg,#5c87f9,#8367ed); box-shadow:0 12px 24px #637fe63b; }
    h1 { margin:0 0 9px; font-size:27px; letter-spacing:-.5px; } .welcome p { margin:0; color:#94a0ad; font-size:14px; }
    .result { display:none; padding: 28px 0 135px; white-space:pre-wrap; line-height:1.75; font-size:14px; color:#303b49; overflow:auto; }
    .composer-wrap { padding: 0 0 22px; } .composer { border:1px solid #dfe5ec; border-radius:16px; background:#fff; box-shadow: 0 8px 24px #1e293b0a; overflow:hidden; }
    textarea { width:100%; min-height:72px; resize:none; border:0; outline:0; padding:16px 17px 7px; color:#253142; background:transparent; } textarea::placeholder { color:#a9b2bd; }
    .composer-tools { display:flex; align-items:center; justify-content:space-between; padding:7px 10px 10px 14px; color:#91a0ad; font-size:12px; } .composer-left { display:flex; gap:7px; align-items:center; }
    .pill, .send { border:1px solid #e4e9ef; background:#fff; border-radius:8px; padding:6px 9px; color:#718091; } .pill:hover { background:#f7f9fc; } .send { border:0; width:32px; height:32px; padding:0; border-radius:10px; color:#fff; background:#5b7df0; font-size:16px; } .send:disabled { background:#ccd5e6; }
    .settings { display:none; position:fixed; z-index:3; right:22px; top:70px; width:360px; border:1px solid #e2e7ee; border-radius:14px; padding:16px; background:#fff; box-shadow:0 18px 50px #1e293b24; } .settings.open { display:block; }
    .settings h3 { margin:0 0 14px; font-size:15px; } .field { display:flex; flex-direction:column; gap:6px; margin:11px 0; } .field span { font-size:12px; color:#718091; } input, select { width:100%; border:1px solid #e1e7ee; border-radius:8px; padding:9px 10px; outline:0; background:#fbfcfe; color:#334155; } input:focus, select:focus { border-color:#7895ed; box-shadow:0 0 0 3px #7895ed18; } .settings-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
    .choose { border:1px solid #e1e7ee; background:#fff; color:#667587; border-radius:8px; padding:7px 10px; } .save { border:0; background:#5b7df0; color:#fff; border-radius:8px; padding:7px 13px; }
    @media (max-width: 760px) { .sidebar { width:220px; flex-basis:220px; } .conversation { width:calc(100% - 30px); } .topbar { padding:0 15px; } }
  </style>
</head>
<body><div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✦</div><span>dsh-sci</span></div>
    <button class="new-chat" id="newChat"><span class="plus">＋</span>新建会话</button>
    <div class="section-title">工作区</div>
    <div class="workspace"><div class="workspace-head"><span class="folder">▣</span><span>当前工作区</span></div><div class="workspace-path" id="workspaceLabel">D:\\code\\dsh-sci</div></div>
    <div class="section-title">最近会话</div><div class="history"><div class="history-item active">新会话</div></div>
    <div class="sidebar-bottom"><button class="plain" id="settingsBtn">⚙ 设置</button><button class="plain" id="aboutBtn">ⓘ 关于 dsh-sci</button></div>
  </aside>
  <section class="main">
    <header class="topbar"><span class="title">工作区智能体</span><div class="status"><i class="dot"></i><span id="providerStatus">正在读取配置…</span><button class="plain" id="topSettings" style="padding:3px 7px">⚙</button></div></header>
    <div class="conversation"><div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>有什么可以帮你？</h1><p>我可以阅读项目文件、分析代码，并在授权后修改工作区。</p></div><div class="result" id="result"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="描述你的任务，或询问工作区中的任何问题…"></textarea><div class="composer-tools"><div class="composer-left"><button class="pill" id="permissionBtn">只读 ▾</button><span id="modelHint">TokenFans Codex · gpt-6.1-sol</span></div><button class="send" id="run" title="运行">↑</button></div></div></div></div>
  </section>
  <div class="settings" id="settings"><h3>连接与工作区</h3><label class="field"><span>工作区目录</span><div style="display:flex;gap:7px"><input id="workspace" value="D:\\code\\dsh-sci" /><button class="choose" id="choose">选择</button></div></label><label class="field"><span>接口配置</span><select id="provider"><option value="tokenfans-codex">TokenFans Codex</option><option value="openai">OpenAI Responses</option><option value="custom">自定义兼容接口</option></select></label><label class="field"><span>API 地址</span><input id="baseUrl" placeholder="使用配置默认地址" /></label><label class="field"><span>模型</span><input id="model" placeholder="使用配置默认模型" /></label><label class="field"><span>API Key</span><input id="apiKey" type="password" placeholder="使用本地配置中的密钥" /></label><label class="field"><span>权限模式</span><select id="permission"><option value="read-only">只读</option><option value="workspace-write">工作区内修改</option><option value="full-access">完全权限</option></select></label><div class="settings-actions"><button class="choose" id="closeSettings">取消</button><button class="save" id="saveSettings">保存配置</button></div></div>
</div><script>
const $ = id => document.getElementById(id); let config;
function openSettings(open=true){ $("settings").classList.toggle("open",open); }
$("settingsBtn").onclick = () => openSettings(); $("topSettings").onclick = () => openSettings(); $("closeSettings").onclick = () => openSettings(false);
$("aboutBtn").onclick = () => alert("dsh-sci 0.1.0\\n清洁室重构的本地工作区智能体");
$("choose").onclick = async () => { const folder = await window.dshSci.chooseFolder(); if(folder){ $("workspace").value=folder; $("workspaceLabel").textContent=folder; config=await window.dshSci.getConfig({workspace:folder}); applyConfig(); } };
function applyConfig(){ if(!config) return; const p=config.selected; $("provider").value=p.providerId; $("baseUrl").value=p.baseUrl; $("model").value=p.model; $("providerStatus").textContent=p.label; $("modelHint").textContent=p.label+" · "+p.model; $("workspaceLabel").textContent=$("workspace").value; }
$("provider").onchange = () => { const p=config?.profiles?.find(x=>x.id===$("provider").value); if(p){ $("baseUrl").value=p.baseUrl; $("model").value=p.model; $("modelHint").textContent=p.label+" · "+p.model; } };
$("permissionBtn").onclick = () => { const x=$("permission"); x.selectedIndex=(x.selectedIndex+1)%3; $("permissionBtn").textContent=x.options[x.selectedIndex].text+" ▾"; };
$("newChat").onclick = () => { $("prompt").value=""; $("result").style.display="none"; $("welcome").style.display="block"; $("prompt").focus(); };
$("saveSettings").onclick = () => { $("workspaceLabel").textContent=$("workspace").value; $("modelHint").textContent=$("provider").selectedOptions[0].text+" · "+$("model").value; openSettings(false); };
$("run").onclick = async () => { const prompt=$("prompt").value.trim(); if(!prompt)return; $("run").disabled=true; $("providerStatus").textContent="运行中…"; $("welcome").style.display="none"; $("result").style.display="block"; $("result").textContent="正在处理…"; try { const r=await window.dshSci.runAgent({workspace:$("workspace").value,permission:$("permission").value,providerId:$("provider").value,model:$("model").value||undefined,baseUrl:$("baseUrl").value||undefined,apiKey:$("apiKey").value||undefined,prompt}); $("result").textContent=r.text+"\\n\\n快照："+r.snapshot; $("providerStatus").textContent=r.provider; } catch(e){ $("result").textContent=String(e?.stack||e); $("providerStatus").textContent="请求失败"; } $("run").disabled=false; };
(async()=>{ try{ config=await window.dshSci.getConfig({workspace:$("workspace").value}); applyConfig(); }catch(e){ $("providerStatus").textContent="配置读取失败"; } })();
</script></body></html>
